name: Continuous Integration
on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: '${{github.workflow}} @ ${{github.head_ref || github.ref_name}}'
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Lint
        run: make lint
      - name: Lint types
        run: make test-types
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript
          config: |
            name: Recurly Security Tests
            query-filters:
            paths-ignore:
              - '**/node_modules'
              - '**/*test*'
          queries: + security-and-quality
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        continue-on-error: true
        with:
          category: /language:javascript
  test_local:
    name: ${{matrix.test-type}} test (${{matrix.browser}})
    runs-on: ubuntu-latest
    env:
      # TODO(SWI-5336): coactions/setup-xvfb has no node24 release yet (latest: v1.0.1 still uses node16).
      # Remove once a node24-compatible version is available upstream.
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    strategy:
      fail-fast: false
      matrix:
        test-type:
          - Unit
          - End-to-end
        browser:
          - Chrome
          - Firefox
          - Edge
    steps:
      - uses: browser-actions/setup-chrome@v2
        if: ${{matrix.browser == 'Chrome'}}
      - uses: browser-actions/setup-firefox@v1
        if: ${{matrix.browser == 'Firefox'}}
      - name: Set up EdgeDriver
        if: ${{matrix.browser == 'Edge' && matrix.test-type == 'End-to-end'}}
        run: |
          DRIVER=$(which msedgedriver 2>/dev/null || find /usr /opt -name msedgedriver -type f 2>/dev/null | head -1)
          if [ -z "$DRIVER" ]; then echo "msedgedriver not found on PATH or in /usr, /opt"; exit 1; fi
          cp "$DRIVER" /tmp/msedgedriver
          chmod +x /tmp/msedgedriver
      - uses: actions/checkout@v6
      - name: Unit test
        if: ${{matrix.test-type == 'Unit'}}
        env:
          BROWSER: ${{matrix.browser}}
        run: make test-unit-ci
      - name: End-to-end test
        if: ${{matrix.test-type == 'End-to-end'}}
        uses: coactions/setup-xvfb@v1.0.1
        env:
          BROWSER: ${{matrix.browser}}
          DISPLAY: :99
        with:
          run: make test-e2e-ci
      - name: Upload visual regression artifacts
        if: ${{failure() && matrix.test-type == 'End-to-end'}}
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-${{matrix.browser}}-${{github.run_id}}
          path: tmp/
          if-no-files-found: ignore
  test_remote:
    name: ${{matrix.test-type}} test (${{matrix.browser}})
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5
      fail-fast: false
      matrix:
        test-type:
          - Unit
          - End-to-end
        browser:
          - Safari-Remote
          - iOS-26-Remote
          - iOS-18-Remote
          - Android-16-Remote
          - Android-15-Remote
    steps:
      - uses: ahmadnassri/action-workflow-queue@v1
      - uses: actions/checkout@v6
      - name: Unit test
        if: ${{matrix.test-type == 'Unit'}}
        uses: nick-fields/retry@v4
        env:
          BROWSER: ${{matrix.browser}}
          BROWSER_STACK_USERNAME: ${{secrets.BROWSER_STACK_USERNAME}}
          BROWSER_STACK_ACCESS_KEY: ${{secrets.BROWSER_STACK_ACCESS_KEY}}
        with:
          timeout_minutes: 12
          max_attempts: 2
          command: make test-unit-ci
      - name: End-to-end test
        if: ${{matrix.test-type == 'End-to-end'}}
        uses: nick-fields/retry@v4
        env:
          BROWSER: ${{matrix.browser}}
          BROWSER_STACK_USERNAME: ${{secrets.BROWSER_STACK_USERNAME}}
          BROWSER_STACK_ACCESS_KEY: ${{secrets.BROWSER_STACK_ACCESS_KEY}}
        with:
          timeout_minutes: 16
          max_attempts: 2
          command: make test-e2e-ci
      - name: Log BrowserStack build URL
        if: ${{always()}}
        env:
          BROWSER_STACK_USERNAME: ${{secrets.BROWSER_STACK_USERNAME}}
          BROWSER_STACK_ACCESS_KEY: ${{secrets.BROWSER_STACK_ACCESS_KEY}}
        run: |
          TEST_TYPE=$([[ "${{matrix.test-type}}" == "Unit" ]] && echo "unit" || echo "e2e")
          BUILD_NAME="${GITHUB_RUN_ID}/${TEST_TYPE}/${{matrix.browser}}"

          RESPONSE=$(curl -sf -u "${BROWSER_STACK_USERNAME}:${BROWSER_STACK_ACCESS_KEY}" \
            "https://api.browserstack.com/automate/builds.json?limit=20" || true)

          [[ -z "${RESPONSE}" ]] && exit 0

          export BS_BUILD_NAME="${BUILD_NAME}"
          BUILD_ID=$(echo "${RESPONSE}" | node -e "
            let d = '';
            process.stdin.on('data', c => d += c);
            process.stdin.on('end', () => {
              try {
                const builds = JSON.parse(d);
                const m = builds.find(b => b.automation_build.name === process.env.BS_BUILD_NAME);
                if (m) process.stdout.write(m.automation_build.hashed_id);
              } catch {}
            });
          ")

          if [[ -n "${BUILD_ID}" ]]; then
            URL="https://automate.browserstack.com/builds/${BUILD_ID}"
            echo "BrowserStack build: ${URL}"
            echo "### BrowserStack" >> "${GITHUB_STEP_SUMMARY}"
            echo "" >> "${GITHUB_STEP_SUMMARY}"
            echo "[${{matrix.test-type}} (${{matrix.browser}})](${URL})" >> "${GITHUB_STEP_SUMMARY}"
          fi
      - name: Upload visual regression artifacts
        if: ${{failure() && matrix.test-type == 'End-to-end'}}
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-${{matrix.browser}}-${{github.run_id}}
          path: tmp/
          if-no-files-found: ignore
  integration_test:
    name: Integration test with react-recurly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: recurly/react-recurly
          path: vendor
      - name: react-recurly
        env:
          RECURLY_JS_SHA: ${{github.sha}}
        run: |-
          cd vendor
          make test
  verify:
    name: Verify required checks
    runs-on: ubuntu-latest
    if: ${{always()}}
    needs:
      - lint
      - analyze
      - test_local
      - test_remote
      - integration_test
    steps:
      - name: Check status for pull requests
        if: |-
          ${{
            github.event_name == 'pull_request'
            && (
              needs.lint.result != 'success'
              || needs.analyze.result != 'success'
              || needs.test_local.result != 'success'
              || needs.test_remote.result != 'success'
              || needs.integration_test.result != 'success'
            )
          }}
        run: exit 1
  publish:
    name: Publish artifacts
    runs-on: ubuntu-latest
    env:
      # TODO(SWI-5336): coactions/setup-xvfb has no node24 release yet (latest: v1.0.1 still uses node16).
      # Remove once a node24-compatible version is available upstream.
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    needs:
      - lint
      - analyze
      - test_local
      - test_remote
    steps:
      - uses: actions/checkout@v6
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Build
        run: make build
      - name: Report coverage
        env:
          COVERALLS_REPO_TOKEN: ${{secrets.COVERALLS_REPO_TOKEN}}
        run: make test-unit-cov-ci
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{secrets.GCR_QA_PUBLIC_DEVOPS_SA}}
      - name: Upload to Google Cloud Storage
        uses: google-github-actions/upload-cloud-storage@v3
        with:
          path: build
          destination: ${{secrets.ARTIFACT_BUCKET_NAME}}/recurly-js/${{github.sha}}/
          parent: false
          process_gcloudignore: false
      - name: Upload to Google Cloud Storage for pull requests
        if: ${{github.event_name == 'pull_request'}}
        uses: google-github-actions/upload-cloud-storage@v3
        with:
          path: build
          destination: ${{secrets.ARTIFACT_BUCKET_NAME}}/recurly-js/pull-request--${{github.event.number}}/
          parent: false
          process_gcloudignore: false
      - name: Summarize
        run: |
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{github.sha}}\`" >> $GITHUB_STEP_SUMMARY
          [[ "${{ github.event_name }}" == "pull_request" ]] && echo "- \`pull-request--${{github.event.number}}\`" >> $GITHUB_STEP_SUMMARY || true
